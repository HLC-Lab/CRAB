# Quantum ESPRESSO pw.x alone on 2 nodes (4 ranks per node).
#
# Setup, once, from your SbatchMan project directory (the folder you launch from):
#   sbatchman init
#   sbatchman set-cluster-name leonardo
#   cp <CRAB checkout>/examples/sbatchman/configs.leonardo.yaml .
#   (edit it: fill in <YOUR_ACCOUNT> and <CRAB_DIR>)
# Copy this file next to configs.leonardo.yaml, then check and launch:
#   sbatchman launch -f qe-alone.yaml --dry-run
#   sbatchman launch -f qe-alone.yaml
# `configs.leonardo.yaml` defines one SbatchMan config per node count, named crab_run_<nodes>; its
# `nodes` list must hold every value of `nodes` below.
#
# Measures: Quantum ESPRESSO pw.x alone on 2 nodes: the reference run. Needs QE registered with
# `crab setup` (a module install is fine). The input (a silicon SCF run) and its pseudopotential
# are read from the CRAB checkout, see qe/README.md; the metric is `wall_time` in seconds.
configs: configs.leonardo.yaml
variables:
  nodes:
    - 2
jobs:
  - config: crab_run_{nodes}
    tag: qe-alone-{nodes}n
    # The heredoc is unquoted (<<JSON) so the shell expands $CRAB_ROOT, which SbatchMan sets.
    # Keep every other `$` and backtick out of the JSON.
    preprocess: |
      mkdir -p "$SBATCHMAN_JOB_DIR"
      cat > "$SBATCHMAN_JOB_DIR/config.json" <<JSON
      {
        "schema_version": 2,
        "global_options": {
          "numnodes": "{nodes}",
          "ppn": "4",
          "name": "qe-alone-{nodes}n"
        },
        "experiments": {
          "run": {
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": ""
              }
            }
          }
        }
      }
      JSON
    command: crab worker --workdir "$SBATCHMAN_JOB_DIR"
