# Quantum ESPRESSO pw.x against incast noise: a QE baseline versus the same QE next to an incast aggressor.
#
# Setup, once, from your SbatchMan project directory (the folder you launch from):
#   sbatchman init
#   sbatchman set-cluster-name leonardo
#   cp <CRAB checkout>/examples/sbatchman/configs.leonardo.yaml .
#   (edit it: fill in <YOUR_ACCOUNT> and <CRAB_DIR>)
# Copy this file next to configs.leonardo.yaml, then check and launch:
#   sbatchman launch -f qe-noise.yaml --dry-run
#   sbatchman launch -f qe-noise.yaml
# `configs.leonardo.yaml` defines one SbatchMan config per node count for QE, named crab_qe_<nodes>;
# its `nodes` list must hold every value of `nodes` below.
# The `time` in configs.leonardo.yaml must cover six experiments in a row (three baselines and
# three noise runs).
#
# Measures: how much incast noise slows a Quantum ESPRESSO pw.x SCF run (metric `wall_time`), on
# 4 nodes: QE gets 2 nodes and the aggressor 2. See blink-noise.yaml for the six-experiment design:
# one job, r1_baseline, r1_noise, r2_baseline, r2_noise, r3_baseline, r3_noise in one allocation,
# the nodes split 50/50 interleaved, and a continuous Blink incast aggressor (2 MiB messages) that
# runs only in the noise experiments and stops when QE ends. Needs QE registered with `crab setup`
# (a module install is fine). The QE module on Leonardo is a GPU build, so these jobs use the GPU
# config (`crab_qe_<nodes>`, 4 GPUs per node). The input (a silicon SCF run) and its pseudopotential
# are read from the CRAB checkout, see qe/README.md.
configs: configs.leonardo.yaml
variables:
  nodes:
    - 4
jobs:
  - config: crab_qe_{nodes}
    tag: qe-noise-{nodes}n
    # The heredoc is unquoted (<<JSON) so the shell expands $CRAB_ROOT, which SbatchMan sets.
    # Keep every other `$` and backtick out of the JSON.
    preprocess: |
      mkdir -p "$SBATCHMAN_JOB_DIR"
      cat > "$SBATCHMAN_JOB_DIR/config.json" <<JSON
      {
        "schema_version": 2,
        "global_options": {
          "numnodes": "{nodes}",
          "ppn": "4",
          "name": "qe-noise-{nodes}n"
        },
        "experiments": {
          "r1_baseline": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              }
            }
          },
          "r1_noise": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              },
              "1": {
                "path": "blink/incast/incast_nb.py",
                "args": "-msgsize 2097152 -endl",
                "collect": false,
                "start": "0",
                "end": "f",
                "partition": "aggressor"
              }
            }
          },
          "r2_baseline": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              }
            }
          },
          "r2_noise": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              },
              "1": {
                "path": "blink/incast/incast_nb.py",
                "args": "-msgsize 2097152 -endl",
                "collect": false,
                "start": "0",
                "end": "f",
                "partition": "aggressor"
              }
            }
          },
          "r3_baseline": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              }
            }
          },
          "r3_noise": {
            "local_options": {
              "allocation": {
                "mode": "interleaved",
                "partitions": {
                  "victim": {"share": 50},
                  "aggressor": {"share": 50}
                }
              }
            },
            "apps": {
              "0": {
                "path": "quantum-espresso/pw/v7.py",
                "args": "",
                "input_file": "$CRAB_ROOT/examples/sbatchman/qe/si-scf.in",
                "pseudo_dir": "$CRAB_ROOT/examples/sbatchman/qe",
                "collect": true,
                "start": "0",
                "end": "",
                "partition": "victim"
              },
              "1": {
                "path": "blink/incast/incast_nb.py",
                "args": "-msgsize 2097152 -endl",
                "collect": false,
                "start": "0",
                "end": "f",
                "partition": "aggressor"
              }
            }
          }
        }
      }
      JSON
    command: crab worker --workdir "$SBATCHMAN_JOB_DIR"
