[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crab"
version = "0.1.0"
description = "Co-Running Applications Benchmarking framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3.3.0",
    "linkify-it-py>=2.0.3",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "mdurl>=0.1.2",
    "numpy>=2.0.2",
    "pandas>=2.3.2",
    "platformdirs>=4.3.8",
    "Pygments>=2.19.2",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "questionary>=2.0.1",
    "rich>=14.1.0",
    "scipy>=1.13.1",
    "six>=1.17.0",
    "typing_extensions>=4.15.0",
    "tzdata>=2025.2",
    "uc-micro-py>=1.0.3"
]

[project.optional-dependencies]
tui = [
    "textual>=6.1.0",
    "textual-fspicker>=0.5.0"
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncssh>=2.18.0"
]
# Developer tooling (not needed by end users). Run everything via `make verify`.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0"
]
# Back-compat alias for the old extra name.
web-dev = [
    "crab[dev]"
]

[project.scripts]
crab = "crab.cli.main:cli_router"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the legacy export template and the built web UI assets inside the wheel.
crab = ["crab_dashboard.html", "web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W core, I import order, UP modernize, B bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines: the formatter handles code; prose/URLs in strings stay readable
]

[tool.mypy]
# Scoped to the fully type-hinted web layer and its CLI seam; widen over time.
files = ["src/crab/web", "src/crab/cli/contract.py"]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["asyncssh", "asyncssh.*", "uvicorn", "uvicorn.*", "platformdirs"]
ignore_missing_imports = true
