name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: make verify (Python + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/crab/webui/package-lock.json
      - name: Install Python package with all extras
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[web,tui,dev]"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/crab/webui
      - run: make verify

  docs:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  package:
    name: Package sanity (min Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The minimum supported version — guards against syntax newer than the
          # declared floor (e.g. 3.11+ features slipping in) breaking `crab setup`.
          python-version: "3.10"
      - run: pip install -e .
      - name: Syntax-check the package
        run: python -m compileall -q src/
      - name: Smoke-test the CLI entry point
        run: crab --help
